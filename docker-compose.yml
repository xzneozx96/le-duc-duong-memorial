# Production stack. Start with: docker compose up -d --build   (see docs/deploy.md)
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PHOTO_QUOTA_BYTES: ${PHOTO_QUOTA_BYTES:-20000000000}
    mem_limit: 512m
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    mem_limit: 128m

volumes:
  caddy_data:
  caddy_config:
