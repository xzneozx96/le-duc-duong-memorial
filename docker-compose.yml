# Production stack. Start with: docker compose up -d --build   (see docs/deploy.md)
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://s3:8333
      PHOTO_QUOTA_BYTES: ${PHOTO_QUOTA_BYTES:-20000000000}
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    mem_limit: 512m
    expose:
      - "3000"

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 384m

  # S3-compatible object store for photos (SeaweedFS, S3 gateway on 8333). Not published to the host.
  # The access keys come from .env; requests without them are refused, so the bucket is private.
  s3:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    command: server -dir=/data -filer -s3 -s3.port=8333 -ip=s3 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=256
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333 && nc -z 127.0.0.1 8888"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 512m

  # One-shot: creates the bucket on first start (no-op afterwards), then exits.
  s3-init:
    image: chrislusf/seaweedfs:4.50
    restart: "no"
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        sh_cmd() { echo "$$1" | weed shell -master=s3:9333 -filer=s3:8888; }
        if sh_cmd "s3.bucket.list" | grep -qE "^[[:space:]]*$$S3_BUCKET([[:space:]]|$$)"; then
          echo "bucket $$S3_BUCKET exists"
        else
          sh_cmd "s3.bucket.create -name $$S3_BUCKET"
          sh_cmd "s3.bucket.list" | grep -qE "^[[:space:]]*$$S3_BUCKET([[:space:]]|$$)"
          echo "bucket $$S3_BUCKET created"
        fi

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    mem_limit: 128m

volumes:
  pgdata:
  s3data:
  caddy_data:
  caddy_config:
